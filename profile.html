<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18243b">
  <title>Профайл · My Homework</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="profile-title">
      <a class="auth-back" href="./index.html">← Даалгавар руу буцах</a>
      <a class="auth-brand" href="./index.html"><span class="auth-mark">✓</span><span>myhomework.</span></a>
      <p class="auth-kicker">ACCOUNT PROFILE</p>
      <h1 id="profile-title">Профайл</h1>
      <p class="auth-subtitle">Account мэдээллээ эндээс удирдана.</p>
      <label class="auth-field">Нэр<input id="profile-name" type="text" autocomplete="name" minlength="2" maxlength="60"></label>
      <label class="auth-field">Имэйл<input id="profile-email" type="email" readonly></label>
      <div class="profile-meta">
        <div><span>БҮРТГҮҮЛСЭН</span><strong id="profile-created">—</strong></div>
        <div><span>CLOUD SYNC</span><strong>Firebase идэвхтэй</strong></div>
      </div>
      <p class="auth-status" id="status" role="status" aria-live="polite"></p>
      <div class="profile-actions">
        <button class="auth-primary" id="profile-save" type="button">Нэр хадгалах</button>
        <button class="auth-secondary" id="profile-logout" type="button">Гарах</button>
      </div>
    </section>
  </main>
  <script src="./firebase-auth-utils.js"></script>
  <script type="module" src="./profile.js"></script>
</body>
</html>
